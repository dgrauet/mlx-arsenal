[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-arsenal"
version = "0.8.0"
description = "Reusable mid-level building blocks for MLX — the missing layer between mlx.nn and full model implementations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "dgrauet" }]
keywords = ["mlx", "apple-silicon", "deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.31.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.7.0",
    "pre-commit>=3.5",
    "ty>=0.0.0a1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/dgrauet/mlx-arsenal"
Repository = "https://github.com/dgrauet/mlx-arsenal"
Documentation = "https://dgrauet.github.io/mlx-arsenal"
Issues = "https://github.com/dgrauet/mlx-arsenal/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlx_arsenal*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N806: tensor dims (B, C, H, W, T) are idiomatic uppercase in ML code.
ignore = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]
# Strict-mode opt-in for PYTHON_QU003 (intendant). See ADR-0003 for rationale.
