[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-arsenal"
version = "0.11.0"
description = "Reusable mid-level building blocks for MLX — the missing layer between mlx.nn and full model implementations"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "dgrauet" }]
keywords = ["mlx", "apple-silicon", "deep-learning", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.31.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    # mlx 0.32.0 shipped without the bundled .pyi stubs (mlx/core/*.pyi), so
    # `ty check` cannot resolve mlx.core there (ml-explore/mlx#3916). 0.32.1
    # restores all 8 stubs; floor the dev env above the one broken release.
    "mlx>=0.32.1",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15.0",
    "pre-commit>=3.5",
    "ty==0.0.63",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.urls]
Homepage = "https://github.com/dgrauet/mlx-arsenal"
Repository = "https://github.com/dgrauet/mlx-arsenal"
Documentation = "https://dgrauet.github.io/mlx-arsenal"
Issues = "https://github.com/dgrauet/mlx-arsenal/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlx_arsenal*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N803/N806: tensor dims (B, C, H, W, T) are idiomatic uppercase in ML code.
ignore = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running GPU tests, deselected by default"]
addopts = "-m 'not slow'"

[tool.coverage.run]
branch = true
source = ["mlx_arsenal"]

[tool.ty.environment]
# Pin to the minimum supported interpreter so checks match `requires-python`.
python-version = "3.10"

[tool.ty.terminal]
# Strict mode: any warning-level diagnostic is a hard failure (non-zero exit).
error-on-warning = true

[tool.ty.rules]
# Promote gradual-typing laxity to errors (these default to warn/ignore).
redundant-cast = "error"
unused-ignore-comment = "error"
invalid-ignore-comment = "error"
deprecated = "error"
division-by-zero = "error"
