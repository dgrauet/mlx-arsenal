name: Kernel vs MLX main

# ADR-0002 gate 3, early warning: build the staged block-sparse kernel
# (src/mlx_arsenal/attention/_sol_kernel.py) against the steel headers of
# MLX main, so a header change shows up before the MLX release that ships it.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: build + parity against MLX main headers
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch the Metal kernel headers of MLX main
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ml-explore/mlx.git "$RUNNER_TEMP/mlx-main"
          git -C "$RUNNER_TEMP/mlx-main" sparse-checkout set mlx/backend/metal/kernels
          echo "MLX main at $(git -C "$RUNNER_TEMP/mlx-main" rev-parse HEAD)"

      - name: Build and probe the kernel
        env:
          MLX_ARSENAL_STEEL_INCLUDE: ${{ runner.temp }}/mlx-main
        run: pytest tests/test_attention_sol_kernel.py -v
