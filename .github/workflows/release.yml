name: Release

# Two triggers cover both manual and automated release flows:
#   - `push: tags: v*` fires when a contributor pushes a tag manually
#     (or when release-please's tag is re-pushed from a non-Actions source).
#   - `release: published` fires when a GitHub Release is published, which
#     is the path release-please takes when it merges its own PR.
#
# In practice today, neither event dispatches when release-please runs
# under the default GITHUB_TOKEN (GitHub suppresses Action-created events
# to prevent recursive workflows). The long-term fix is a PAT on the
# release-please action; until then, contributors re-push the tag from
# their CLI to trigger this workflow. The `release: published` line is
# defensive — it activates automatically the day release-please switches
# to a PAT.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve tag name (push or release event)
        id: refname
        env:
          PUSH_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$PUSH_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches pyproject version
        env:
          REF_NAME: ${{ steps.refname.outputs.name }}
        run: |
          TAG="${REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match pyproject version $PKG"; exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mlx-arsenal
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create or update GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Resolve tag name (push or release event)
        id: refname
        env:
          PUSH_REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=$PUSH_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.refname.outputs.name }}
        # If release-please already created the release, `gh release create`
        # exits non-zero. Fall back to uploading artifacts to the existing one.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*
          fi
